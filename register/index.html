<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户注册页面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 语义化header -->
    <header>
        <h1>用户注册</h1>
    </header>

    <main>
        <!-- 注册表单 -->
        <form id="registerForm">
            <p>
                <label for="username">用户名：</label>
                <input type="text" name="username" id="username" required>
            </p >
            <p>
                <label for="password">密码：</label>
                <input type="password" name="password" id="password" placeholder="6-16位字符">
            </p >
            <p>
                <label for="confirmPassword">确认密码：</label>
                <input type="password" name="confirmPassword" id="confirmPassword">
            </p >
            <p>
                性别：
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">男</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">女</label>
            </p >
            <p>
                <label for="birthday">出生日期：</label>
                <input type="date" name="birthday" id="birthday">
            </p >
            <p>
                <label for="email">邮箱：</label>
                <input type="email" name="email" id="email" required>
            </p >
            <p>
                <label for="phone">手机号：</label>
                <input type="tel" name="phone" id="phone" pattern="[0-9]{11}" required>
            </p >
            <p>
                兴趣爱好：
                <input type="checkbox" name="hobby" value="reading">阅读
                <input type="checkbox" name="hobby" value="game">游戏
                <input type="checkbox" name="hobby" value="sport">运动
            </p >
            <p>
                <label for="avatar">头像上传：</label>
                <input type="file" name="avatar" id="avatar" accept="image/*" multiple>
            </p >
            <p>
                <label for="city">所在城市：</label>
                <select name="city" id="city">
                    <option value="changde" selected>常德</option>
                    <option value="changsha">长沙</option>
                    <option value="wuhan">武汉</option>
                </select>
            </p >
            <p>
                <label for="bio">个人简介：</label>
                <textarea name="bio" id="bio" rows="4" cols="50"></textarea>
            </p >
            <p>
                <button type="submit">注册</button>
                <button type="reset">重置</button>
            </p >
        </form>

        <!-- 表格：注册须知，包含合并单元格 colspan -->
        <table>
            <thead>
                <tr>
                    <th colspan="2">注册须知</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>条款</td>
                    <td>说明</td>
                </tr>
                <tr>
                    <td>账号安全</td>
                    <td>请妥善保管账号密码，不要转借他人</td>
                </tr>
                <tr>
                    <td>信息真实</td>
                    <td>注册信息必须如实填写</td>
                </tr>
            </tbody>
        </table>

        <!-- 无序列表 ul 注册注意事项 -->
        <h3>注册注意事项</h3>
        <ul>
            <li>用户名不能包含特殊符号</li>
            <li>手机号必须为11位数字</li>
            <li>邮箱需要可以正常接收邮件</li>
        </ul>
        <!-- 有序列表 ol 注册步骤 -->
        <h3>注册步骤</h3>
        <ol>
            <li>填写个人表单信息</li>
            <li>阅读注册须知</li>
            <li>提交表单完成注册</li>
        </ol>
        <!-- 定义列表 dl 常见问题 -->
        <h3>常见问题</h3>
        <dl>
            <dt>收不到邮箱验证码？</dt>
            <dd>检查垃圾邮件箱</dd>
            <dt>手机号提示格式错误？</dt>
            <dd>确认输入11位纯数字</dd>
        </dl>
    </main>

    <footer>
        <p>©2026 用户注册系统 版权所有</p >
    </footer>

    <!-- JS：表单提交，控制台打印数据 -->
    <script>
        const form = document.getElementById("registerForm");
        form.addEventListener("submit", function(e){
            e.preventDefault();
            const formData = new FormData(form);
            const dataObj = {};
            for(let pair of formData){
                dataObj[pair[0]] = pair[1];
            }
            console.log("表单收集的数据：", dataObj);
        })
    </script>
</body>
</html>
