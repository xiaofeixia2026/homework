<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一级水平导航菜单</title>
    <style>
        table{
            border-collapse: collapse;
            background-color: #2c5282;
        }
        td{
            list-style: none;
        }
        td a{
            display: inline-block;
            padding:12px 18px;
            color:#fff;
            text-decoration: none;
            font-size:15px;
        }
        td a:hover{
            background-color: #4299e1;
        }
    </style>
</head>
<body>
    <table align="center">
        <tr>           
            <td><a href="#">首页</a></td>
            <td><a href="#">教学院(部)</a></td>
            <td><a href="#">党群机构</a></td>
            <td><a href="#">行政教辅机构</a></td>
            <td><a href="#">教学科研</a></td>
            <td><a href="#">招生就业</a></td>
            <td><a href="#">国际交流</a></td>
            <td><a href="#">数字图书馆</a></td>
        </tr>
    </table>
    
</body>
</html>
